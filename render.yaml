services:
  - type: web
    name: anoco-call-service
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_WORKSPACE_DOMAIN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: COUNSELOR_EMAILS
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://vmz931.github.io